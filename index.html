<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Sofi ✨</title>
  <style>
    /* Estilos generales de la página */
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      line-height: 1.8;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .bold-text {
      font-weight: bold;
      font-size: 1.3rem;
    }

    /* Reproductor de música personalizado */
    .music-player {
      margin-top: 30px;
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e9ecef;
      display: inline-block;
    }

    audio {
      outline: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <p>¡Gracias por llenar mis días de tantas risas y momentos bonitos! ✨💛</p>
    
    <p>Eres una amiga increíble y muy especial para mí. 🥰</p>
    
    <p>¡Este ramito brillante es con mucho cariño para ti! 🌻✨</p>
    
    <p>Y nunca lo olvides...</p>
    
    <p class="bold-text">¡Kachow! ⚡ ¡A brillar siempre! 🌟</p>

    <!-- Sección del reproductor de música -->
    <div class="music-player">
      <p style="font-size: 0.9rem; margin-bottom: 8px;">🎵 Reproducir canción:</p>
      <audio controls autoplay loop>
        <source src="cancion.mp3" type="audio/mpeg">
        Tu navegador no soporta el reproductor de audio.
      </audio>
    </div>
  </div>

  <script>
    // Comprobación rápida para confirmar que el audio esté cargado
    const audio = document.querySelector('audio');
    audio.addEventListener('error', () => {
      console.log("No se encontró el archivo 'cancion.mp3' en la misma carpeta.");
    });
  </script>

</body>
</html>
