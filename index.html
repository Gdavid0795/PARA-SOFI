<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para una amiga especial 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="message">
      <p>Gracias por el tiempo que me compartiste,</p>
      <p>gracias por las risas</p>
      <p>y por ser una amiga tan especial.</p>
      <p class="dedication">Esto es para ti 🌻</p>
    </div>

    <div class="bouquet" aria-label="Ramo de girasoles">
      <div class="sunflower s1"><span></span></div>
      <div class="sunflower s2"><span></span></div>
      <div class="sunflower s3"><span></span></div>
      <div class="sunflower s4"><span></span></div>
      <div class="sunflower s5"><span></span></div>
      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="stems"></div>
      <div class="wrap"></div>
      <div class="ribbon"></div>
    </div>

    <div class="final">
      <p>Y recuerda...</p>
      <strong>¡Kachow! ⚡</strong>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
